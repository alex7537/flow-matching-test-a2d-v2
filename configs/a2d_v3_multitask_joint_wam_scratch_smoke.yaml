data:
  data_dir: /share_data/zhangyurui/flow-matching-test-a2d-v2/code/datasets/a2d_v3_multitask_box300_bottle300_seed42
  action_semantics: arm_executed_hand_commanded_joint_position
  image_keys: [rgb_head, rgb_right_hand]
  image_size: 224
  val_ratio: 0.1
  history_steps: 1
  action_horizon: 16
  action_offset_steps: 1
  joint_wam_enabled: true
  video_key: rgb_head
  video_condition_steps: 9
  video_future_steps: 16
  video_future_offset_steps: 1
  joint_video_latent_cache_dir: /share_data/zhangyurui/flow-matching-test-a2d-v2/cache/wan_latents/a2d_v3_multitask_box300_bottle300_joint_wam_v2
  include_tail_padded_windows: true
  transition_oversample_factor: 2
  lift_oversample_factor: 2
  transition_threshold: 0.1
  motion_threshold: 0.0001
  norm_stats: norm_stats.json
  dataset_manifest: dataset_manifest.json
  split_manifest: split_manifest.json
  range_eps: 0.0001
  aug_brightness: 0.2
  aug_contrast: 0.4
  aug_saturation: 0.2
  aug_hue: 0.05
  max_open_hdf5_files: 64

policy:
  type: joint_latent_wam
  action_loss_weight: 1.0
  video_loss_weight: 0.1
  video_latent_channels: 48
  video_condition_latent_steps: 3
  video_future_latent_steps: 4
  video_latent_spatial_size: 14
  video_patch_size: 2

model:
  encoder_type: timm
  use_proprio: true
  enhanced_proprio: false
  timm_model_name: vit_small_r26_s32_224
  timm_pretrained: true
  timm_token_mode: spatial
  timm_tokens_per_frame: 49
  d_model: 384
  n_head: 4
  n_layer: 4
  dropout: 0.0
  time_eps: 0.001
  num_inference_steps: 5
  freeze_encoder_backbone: false

training:
  seed: 42
  device: cuda
  batch_size: 16
  num_workers: 4
  pin_memory: true
  lr: 0.0001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0001
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 20
  num_epochs: 1
  periodic_checkpoint_every_n_epochs: 1
  max_train_steps: 100
  max_val_steps: 10
  init_from: null
  resume_from: null
  ema_enabled: true
  ema_decay: 0.999
  watchdog_timeout_sec: 600
  watchdog_check_interval_sec: 10
  run_name: cfm_multitask_v3_joint_latent_wam_scratch_smoke_seed42_{timestamp}
  output_dir: /share_data/zhangyurui/flow-matching-test-a2d-v2/runs/{run_name}

validation:
  deterministic: true
  seed: 42
  sample_draws: 1

logging:
  wandb:
    enabled: true
    mode: online
    project: a2d-flow-matching
    entity: z1135783608-psibot
    group: a2d-v3-joint-latent-wam-scratch
    job_type: smoke
    tags: [a800, a2d-v3, multitask, joint-wam, scratch, dual-flow, cached-wan-latents, seed42]

visualization:
  rerun:
    enabled: false

deployment:
  eval_bundle:
    enabled: false
