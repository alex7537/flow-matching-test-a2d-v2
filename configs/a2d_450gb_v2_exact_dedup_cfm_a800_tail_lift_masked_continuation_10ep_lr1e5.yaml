data:
  data_dir: /share_data/zhangyurui/flow-matching-test-a2d-v2/datasets/data-rgb-450gb-v2-exact-dedup-keep-last
  image_keys:
  - rgb_head
  - rgb_right_hand
  image_size: 224
  val_ratio: 0.1
  history_steps: 1
  action_horizon: 16
  action_offset_steps: 1
  include_tail_padded_windows: true
  transition_oversample_factor: 2
  lift_oversample_factor: 2
  transition_threshold: 0.1
  motion_threshold: 0.0001
  norm_stats: norm_stats.json
  dataset_manifest: dataset_manifest.json
  split_manifest: split_manifest.json
