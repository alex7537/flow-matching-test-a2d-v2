  device: cuda
  batch_size: 32
  num_workers: 4
  pin_memory: true
  lr: 0.00001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
  warmup_steps: 3438
  num_epochs: 10
  periodic_checkpoint_every_n_epochs: 1
  max_train_steps: null
  max_val_steps: null
  init_from: /share_data/zhangyurui/flow-matching-test-a2d-v2/runs/cfm_1090ep_v2_tail_lift_masked_vit_finetune_01x_50ep_seed42_20260730_224943/best_action_mse.ckpt
