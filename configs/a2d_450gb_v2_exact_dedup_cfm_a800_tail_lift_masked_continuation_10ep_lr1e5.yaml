  ema_enabled: true
  ema_decay: 0.999
  watchdog_timeout_sec: 300
  watchdog_check_interval_sec: 10
  run_name: cfm_1090ep_v2_tail_lift_masked_cont_best_action_lr1e5_10ep_seed42_{timestamp}
  output_dir: /share_data/zhangyurui/flow-matching-test-a2d-v2/runs/{run_name}

