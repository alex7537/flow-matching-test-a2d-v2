data:
  data_dir: /path/to/a2d_processed
  # Select any non-empty subset of the available views.
  image_keys: [rgb_head, rgb_right_hand]
  image_size: 224
  val_ratio: 0.1
  history_steps: 1
  action_horizon: 16
  transition_oversample_factor: 2  # arm-keyframe windows: ~14% raw -> ~25% effective on complete6
  transition_threshold: 0.1  # executed arm/hand keyframe threshold in rad per frame
  motion_threshold: 1.0e-4
  norm_stats: norm_stats.json  # use a new filename or dataset directory for a new dataset version
  range_eps: 1.0e-4
  aug_brightness: 0.2
  aug_contrast: 0.4
  aug_saturation: 0.2
  aug_hue: 0.05

model:
  encoder_type: timm
  use_proprio: true
  timm_model_name: vit_small_r26_s32_224
  timm_pretrained: true
  timm_token_mode: spatial
  timm_tokens_per_frame: 49
  d_model: 384
  n_head: 4
  n_layer: 4
  dropout: 0.0
  time_eps: 1.0e-3
  num_inference_steps: 5

training:
  seed: 42
  device: cpu
  batch_size: 16
  num_workers: 0
  pin_memory: false
  lr: 1.0e-4
  backbone_lr_multiplier: 0.1
  weight_decay: 1.0e-4
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: null  # defaults to 5% of total optimizer steps
  num_epochs: 20
  max_train_steps: null
  max_val_steps: null
  output_dir: /home/psibot/Downloads/flow-matching-test/outputs/minimal_rgb_flow_timm_{timestamp}

logging:
  wandb:
    enabled: false
    mode: online
    project: flow-matching-test
    entity: null
    run_name: null
    group: null
    job_type: train
    tags: [minimal, rgb, flow-matching, timm]

visualization:
  rerun:
    enabled: false
    spawn: false
    save_path: "training.rrd"
    sample_source: val
    sample_every_n_epochs: 1

deployment:
  eval_bundle:
    enabled: false
    execute_horizon: 16
    archive: true
    data_version: unknown
    action_range_guard_margin_ratio: 0.1
    rollout_environment:
      isaac_sim_version: null
      physics_dt_s: 0.008333333333333333
      render_dt_s: 0.03333333333333333
      solver_position_iterations: null
      solver_velocity_iterations: null
      object_mass_kg: null
      static_friction: null
      dynamic_friction: null
    camera_resolutions: {}
    joint_order: [joint_arm2_link_1, joint_arm2_link_2, joint_arm2_link_3, joint_arm2_link_4, joint_arm2_link_5, joint_arm2_link_6, joint_arm2_link_7, hand2_joint_link_1_1, hand2_joint_link_2_1, hand2_joint_link_3_1, hand2_joint_link_4_1, hand2_joint_link_5_1, hand2_joint_link_1_2]
