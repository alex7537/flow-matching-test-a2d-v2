data:
  data_dir: /share_data/zhangyurui/flow-matching-test-a2d-v2/code/datasets/a2d_v3_multitask_box300_bottle300_seed42
  action_semantics: arm_executed_hand_commanded_joint_position
  image_keys: [rgb_head, rgb_right_hand]
  image_size: 224
  val_ratio: 0.1
  history_steps: 1
  action_horizon: 16
  action_offset_steps: 1
  video_aux_enabled: true
  video_key: rgb_head
  video_condition_steps: 9
  video_future_steps: 16
  video_future_offset_steps: 1
  video_latent_cache_dir: /share_data/zhangyurui/flow-matching-test-a2d-v2/cache/wan_latents/a2d_v3_multitask_box300_bottle300_wan22_9plus16_v1
  include_tail_padded_windows: true
  transition_oversample_factor: 2
  lift_oversample_factor: 2
  transition_threshold: 0.1
  motion_threshold: 0.0001
  norm_stats: norm_stats.json
  dataset_manifest: dataset_manifest.json
  split_manifest: split_manifest.json
  range_eps: 0.0001
  aug_brightness: 0.2
  aug_contrast: 0.4
  aug_saturation: 0.2
  aug_hue: 0.05
  max_open_hdf5_files: 64

policy:
  type: flow_matching_video_aux
  video_loss_weight: 0.01
  video_aux_hidden_dim: 128
  video_condition_steps: 9
  video_future_steps: 16
  video_codec_batch_size: 1
  wan_vae_dtype: bfloat16
  wan_vae_checkpoint_path: /share_data/zhangyurui/.cache/huggingface/local-models/Wan2.2-TI2V-5B-vae/Wan2.2_VAE.pth
  wan_runtime_repo: /share_data/zhangyurui/psi-policy_wm_v2
  wan_runtime_site_packages: /share_data/zhangyurui/psi-policy_wm_v2/.venv_psi_policy/lib/python3.11/site-packages

model:
  encoder_type: timm
  use_proprio: true
  enhanced_proprio: false
  timm_model_name: vit_small_r26_s32_224
  timm_pretrained: true
  timm_token_mode: spatial
  timm_tokens_per_frame: 49
  d_model: 384
  n_head: 4
  n_layer: 4
  dropout: 0.0
  time_eps: 0.001
  num_inference_steps: 5
  freeze_encoder_backbone: false

training:
  seed: 42
  device: cuda
  batch_size: 32
  num_workers: 4
  pin_memory: true
  lr: 0.00001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0001
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: null
  num_epochs: 10
  periodic_checkpoint_every_n_epochs: 1
  max_train_steps: null
  max_val_steps: null
  # Intentionally nonexistent: use the launcher and pass the finished mixed-CFM ckpt.
  init_from: /REQUIRED/PASS_CHECKPOINT_TO_LAUNCHER.ckpt
  resume_from: null
  ema_enabled: true
  ema_decay: 0.999
  watchdog_timeout_sec: 600
  watchdog_check_interval_sec: 10
  run_name: cfm_multitask_box300_bottle300_v3_wan_video_aux_posttrain_10ep_seed42_{timestamp}
  output_dir: /share_data/zhangyurui/flow-matching-test-a2d-v2/runs/{run_name}

validation:
  deterministic: true
  seed: 42
  sample_draws: 1

logging:
  wandb:
    enabled: true
    mode: online
    project: a2d-flow-matching
    entity: z1135783608-psibot
    group: cfm-multitask-v3-wan-video-aux-posttrain
    job_type: train
    tags: [a800, cfm, multitask, wan-vae-frozen, cached-latents, video-aux, 9plus16, v3, model-only-init, seed42]

visualization:
  rerun:
    enabled: false

deployment:
  eval_bundle:
    enabled: true
    execute_horizon: 16
    archive: true
    weights_variant: raw
    data_version: a2d_v3_multitask_box300_bottle300_wan_video_aux_posttrain_v1
