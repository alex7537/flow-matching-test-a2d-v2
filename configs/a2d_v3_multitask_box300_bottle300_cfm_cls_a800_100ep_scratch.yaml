    job_type: train
    tags: [a800, cfm, cls-token, condition-3-tokens, multitask, box, bottle, balanced-episodes, rgb-proprio, v3-hybrid-hand-target, exact-dedup, tail-padded, masked-loss, lift-oversample-2x, vit-finetune-01x, scratch, 100ep, 379400-steps, deterministic-val, ema, watchdog, seed42]

